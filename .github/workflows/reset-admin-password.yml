name: One-time Reset Production Admin Password

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reset-production-admin-password
  cancel-in-progress: false

jobs:
  reset-admin-password:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          cat > ~/.ssh/deploy_key <<'SSH_KEY'
          ${{ secrets.SERVER_SSH_KEY }}
          SSH_KEY
          grep -q "PRIVATE KEY" ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Reset the production admin account
        shell: bash
        env:
          ADMIN_RESET_HASH: ${{ secrets.ADMIN_RESET_HASH }}
        run: |
          set -euo pipefail
          test -n "$ADMIN_RESET_HASH"

          ADMIN_RESET_HASH_B64="$(printf '%s' "$ADMIN_RESET_HASH" | base64 -w0)"
          SSH_OPTS="-i ~/.ssh/deploy_key -p 22 -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ConnectTimeout=30"

          ssh $SSH_OPTS root@47.108.175.236 "ADMIN_RESET_HASH_B64='$ADMIN_RESET_HASH_B64' bash -s" <<'REMOTE'
          set -euo pipefail

          APP_DIR=/www/wwwroot/wangkejava
          DB_ENV="$APP_DIR/.db.env"
          ADMIN_HASH="$(printf '%s' "$ADMIN_RESET_HASH_B64" | base64 -d)"

          if [[ ! "$ADMIN_HASH" =~ ^\$2[aby]\$[0-9]{2}\$[./A-Za-z0-9]{53}$ ]]; then
            echo "The supplied password hash is not a valid BCrypt value." >&2
            exit 1
          fi

          if [ -r "$DB_ENV" ]; then
            set -a
            . "$DB_ENV"
            set +a
          fi

          DB_USER="${SPRING_DATASOURCE_DRUID_MASTER_USERNAME:-root}"
          DB_PASSWORD="${SPRING_DATASOURCE_DRUID_MASTER_PASSWORD:-}"
          MYSQL_MODE=

          if MYSQL_PWD="$DB_PASSWORD" mysql -h127.0.0.1 -P3306 -u"$DB_USER" -Nse "select 1" ha >/dev/null 2>&1; then
            MYSQL_MODE=app
          elif mysql -uroot -Nse "select 1" ha >/dev/null 2>&1; then
            MYSQL_MODE=root
          else
            echo "Unable to authenticate to the production database." >&2
            exit 1
          fi

          mysql_exec() {
            if [ "$MYSQL_MODE" = app ]; then
              MYSQL_PWD="$DB_PASSWORD" mysql -h127.0.0.1 -P3306 -u"$DB_USER" "$@"
            else
              mysql -uroot "$@"
            fi
          }

          ADMIN_COUNT="$(mysql_exec -N -B -D ha -e "select count(*) from sys_user where user_name='admin'")"
          if [ "$ADMIN_COUNT" != "1" ]; then
            echo "Expected exactly one admin account, found $ADMIN_COUNT; refusing to update." >&2
            exit 1
          fi

          BACKUP_DIR="$APP_DIR/backups/admin-password-resets"
          BACKUP_FILE="$BACKUP_DIR/admin-before-$(date -u +%Y%m%dT%H%M%SZ).tsv"
          install -m 700 -d "$BACKUP_DIR"
          mysql_exec -N -B -D ha -e "select user_id,user_name,password,status,del_flag,ifnull(date_format(pwd_update_date,'%Y-%m-%d %H:%i:%s'),'NULL') from sys_user where user_name='admin'" > "$BACKUP_FILE"
          chmod 600 "$BACKUP_FILE"

          AFFECTED="$(mysql_exec -N -B -D ha -e "update sys_user set password='$ADMIN_HASH', status='0', del_flag='0', pwd_update_date=now(), update_time=now() where user_name='admin'; select row_count();" | tail -n 1)"
          if [ "$AFFECTED" != "1" ]; then
            echo "Password update affected $AFFECTED rows; expected 1." >&2
            exit 1
          fi

          redis-cli del 'pwd_err_cnt:admin' >/dev/null 2>&1 || true

          mysql_exec -N -B -D ha -e "select concat('verified user_id=',user_id,', status=',status,', del_flag=',del_flag) from sys_user where user_name='admin'"
          echo "Previous account record backed up at $BACKUP_FILE"
          REMOTE
