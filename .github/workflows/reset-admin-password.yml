name: One-time Reset Production Admin Password

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reset-production-admin-password
  cancel-in-progress: false

jobs:
  reset-admin-password:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          cat > ~/.ssh/deploy_key <<'SSH_KEY'
          ${{ secrets.SERVER_SSH_KEY }}
          SSH_KEY
          grep -q "PRIVATE KEY" ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Reset the production admin account
        shell: bash
        env:
          ADMIN_RESET_HASH: ${{ secrets.ADMIN_RESET_HASH }}
          ADMIN_RESET_PASSWORD: ${{ secrets.ADMIN_RESET_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ADMIN_RESET_HASH"
          test -n "$ADMIN_RESET_PASSWORD"

          ADMIN_RESET_HASH_B64="$(printf '%s' "$ADMIN_RESET_HASH" | base64 -w0)"
          ADMIN_RESET_PASSWORD_B64="$(printf '%s' "$ADMIN_RESET_PASSWORD" | base64 -w0)"
          SSH_OPTS="-i ~/.ssh/deploy_key -p 22 -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ConnectTimeout=30"

          ssh $SSH_OPTS root@47.108.175.236 "ADMIN_RESET_HASH_B64='$ADMIN_RESET_HASH_B64' ADMIN_RESET_PASSWORD_B64='$ADMIN_RESET_PASSWORD_B64' bash -s" <<'REMOTE'
          set -euo pipefail

          APP_DIR=/www/wwwroot/wangkejava
          JAVA_HOME=/usr/lib/jvm/java-17-konajdk
          DB_ENV="$APP_DIR/.db.env"
          ADMIN_HASH="$(printf '%s' "$ADMIN_RESET_HASH_B64" | base64 -d)"
          ADMIN_PASSWORD="$(printf '%s' "$ADMIN_RESET_PASSWORD_B64" | base64 -d)"
          PASSWORD_SHA256="$(printf '%s' "$ADMIN_PASSWORD" | sha256sum | awk '{print $1}')"
          echo "Received password length=${#ADMIN_PASSWORD} sha256=$PASSWORD_SHA256"

          if [[ ! "$ADMIN_HASH" =~ ^\$2[aby]\$[0-9]{2}\$[./A-Za-z0-9]{53}$ ]]; then
            echo "The supplied password hash is not a valid BCrypt value." >&2
            exit 1
          fi

          PID="$(ss -lntp 'sport = :8007' 2>/dev/null | sed -n 's/.*pid=\([0-9][0-9]*\).*/\1/p' | head -n 1 || true)"
          PID="${PID:-$(lsof -t -iTCP:8007 -sTCP:LISTEN 2>/dev/null | head -n 1 || true)}"
          PID="${PID:-$(pgrep -f 'wangkejava\.jar|ruoyi-admin\.jar' | head -n 1 || true)}"
          if [ -z "$PID" ]; then
            echo "Running backend process was not found." >&2
            exit 1
          fi

          RUNNING_JAR="$(tr '\0' '\n' < "/proc/$PID/cmdline" | grep -E '\.jar$' | head -n 1 || true)"
          if [ ! -f "$RUNNING_JAR" ]; then
            echo "Running backend JAR was not found." >&2
            exit 1
          fi

          TMP_JARS="$(mktemp -d)"
          trap 'rm -rf "$TMP_JARS"' EXIT
          CRYPTO_ENTRY="$("$JAVA_HOME/bin/jar" tf "$RUNNING_JAR" | grep '^BOOT-INF/lib/spring-security-crypto-.*\.jar$' | head -n 1 || true)"
          JCL_ENTRY="$("$JAVA_HOME/bin/jar" tf "$RUNNING_JAR" | grep '^BOOT-INF/lib/spring-jcl-.*\.jar$' | head -n 1 || true)"
          if [ -z "$CRYPTO_ENTRY" ] || [ -z "$JCL_ENTRY" ]; then
            echo "Required BCrypt libraries were not found in the running backend JAR." >&2
            exit 1
          fi
          (
            cd "$TMP_JARS"
            "$JAVA_HOME/bin/jar" xf "$RUNNING_JAR" "$CRYPTO_ENTRY" "$JCL_ENTRY"
          )
          CRYPTO_JAR="$TMP_JARS/$CRYPTO_ENTRY"
          JCL_JAR="$TMP_JARS/$JCL_ENTRY"
          JSHELL_SCRIPT='import org.springframework.security.crypto.bcrypt.BCryptPasswordEncoder;'
          JSHELL_SCRIPT+=$'\nSystem.out.println("SERVER_HASH=" + new BCryptPasswordEncoder(12).encode(System.getenv("ADMIN_PASSWORD")));'
          JSHELL_SCRIPT+=$'\n/exit'
          JSHELL_OUTPUT="$(printf '%s\n' "$JSHELL_SCRIPT" | ADMIN_PASSWORD="$ADMIN_PASSWORD" "$JAVA_HOME/bin/jshell" -q --class-path "$CRYPTO_JAR:$JCL_JAR" 2>&1)"
          SERVER_HASH="$(sed -n 's/.*SERVER_HASH=\(\$2[aby]\$[0-9][0-9]\$[./A-Za-z0-9]\{53\}\).*/\1/p' <<< "$JSHELL_OUTPUT" | tail -n 1)"
          if [[ ! "$SERVER_HASH" =~ ^\$2[aby]\$[0-9]{2}\$[./A-Za-z0-9]{53}$ ]]; then
            echo "The running backend failed to generate a BCrypt password hash." >&2
            exit 1
          fi
          ADMIN_HASH="$SERVER_HASH"
          echo "Generated BCrypt hash with the running backend library from $(basename "$RUNNING_JAR")."

          process_arg() {
            local key="$1"
            [ -n "$PID" ] || return 0
            tr '\0' '\n' < "/proc/$PID/cmdline" | sed -n "s/^--${key}=//p" | head -n 1
          }

          process_env() {
            local key="$1"
            [ -n "$PID" ] || return 0
            tr '\0' '\n' < "/proc/$PID/environ" | sed -n "s/^${key}=//p" | head -n 1
          }

          LIVE_DB_URL="$(process_arg spring.datasource.druid.master.url)"
          LIVE_DB_USER="$(process_arg spring.datasource.druid.master.username)"
          LIVE_DB_PASSWORD="$(process_arg spring.datasource.druid.master.password)"
          LIVE_DB_URL="${LIVE_DB_URL:-$(process_env SPRING_DATASOURCE_DRUID_MASTER_URL)}"
          LIVE_DB_USER="${LIVE_DB_USER:-$(process_env SPRING_DATASOURCE_DRUID_MASTER_USERNAME)}"
          LIVE_DB_PASSWORD="${LIVE_DB_PASSWORD:-$(process_env SPRING_DATASOURCE_DRUID_MASTER_PASSWORD)}"

          if [ -z "$LIVE_DB_URL" ] && [ -r "$DB_ENV" ]; then
            set -a
            . "$DB_ENV"
            set +a
            LIVE_DB_URL="${SPRING_DATASOURCE_DRUID_MASTER_URL:-jdbc:mysql://127.0.0.1:3306/ha}"
            LIVE_DB_USER="${SPRING_DATASOURCE_DRUID_MASTER_USERNAME:-root}"
            LIVE_DB_PASSWORD="${SPRING_DATASOURCE_DRUID_MASTER_PASSWORD:-}"
          fi

          LIVE_DB_URL="${LIVE_DB_URL:-jdbc:mysql://127.0.0.1:3306/ha}"
          DB_USER="${LIVE_DB_USER:-root}"
          DB_PASSWORD="$LIVE_DB_PASSWORD"
          DB_TARGET="${LIVE_DB_URL#jdbc:mysql://}"
          DB_AUTHORITY="${DB_TARGET%%/*}"
          DB_PATH="${DB_TARGET#*/}"
          DB_NAME="${DB_PATH%%\?*}"
          DB_HOST="${DB_AUTHORITY%%:*}"
          if [[ "$DB_AUTHORITY" == *:* ]]; then
            DB_PORT="${DB_AUTHORITY##*:}"
          else
            DB_PORT=3306
          fi

          if [ -z "$DB_HOST" ] || [ -z "$DB_NAME" ]; then
            echo "Unable to parse the live JDBC database target." >&2
            exit 1
          fi

          echo "Selected live database target: $DB_HOST:$DB_PORT/$DB_NAME user=$DB_USER"
          MYSQL_MODE=

          if MYSQL_PWD="$DB_PASSWORD" mysql -h"$DB_HOST" -P"$DB_PORT" -u"$DB_USER" -Nse "select 1" "$DB_NAME" >/dev/null 2>&1; then
            MYSQL_MODE=app
          elif [ "$DB_HOST" = 127.0.0.1 ] && mysql -uroot -Nse "select 1" "$DB_NAME" >/dev/null 2>&1; then
            MYSQL_MODE=root
          else
            echo "Unable to authenticate to the live production database." >&2
            exit 1
          fi

          mysql_exec() {
            if [ "$MYSQL_MODE" = app ]; then
              MYSQL_PWD="$DB_PASSWORD" mysql -h"$DB_HOST" -P"$DB_PORT" -u"$DB_USER" "$@"
            else
              mysql -uroot "$@"
            fi
          }

          ADMIN_COUNT="$(mysql_exec -N -B -D "$DB_NAME" -e "select count(*) from sys_user where user_name='admin'")"
          if [ "$ADMIN_COUNT" != "1" ]; then
            echo "Expected exactly one admin account, found $ADMIN_COUNT; refusing to update." >&2
            exit 1
          fi

          BACKUP_DIR="$APP_DIR/backups/admin-password-resets"
          BACKUP_FILE="$BACKUP_DIR/admin-before-$(date -u +%Y%m%dT%H%M%SZ).tsv"
          install -m 700 -d "$BACKUP_DIR"
          mysql_exec -N -B -D "$DB_NAME" -e "select user_id,user_name,password,status,del_flag,ifnull(date_format(pwd_update_date,'%Y-%m-%d %H:%i:%s'),'NULL') from sys_user where user_name='admin'" > "$BACKUP_FILE"
          chmod 600 "$BACKUP_FILE"

          AFFECTED="$(mysql_exec -N -B -D "$DB_NAME" -e "update sys_user set password='$ADMIN_HASH', status='0', del_flag='0', pwd_update_date=now(), update_time=now() where user_name='admin'; select row_count();" | tail -n 1)"
          if [ "$AFFECTED" != "1" ]; then
            echo "Password update affected $AFFECTED rows; expected 1." >&2
            exit 1
          fi

          redis-cli del 'pwd_err_cnt:admin' >/dev/null 2>&1 || true

          HASH_MATCH="$(mysql_exec -N -B -D "$DB_NAME" -e "select password='$ADMIN_HASH' from sys_user where user_name='admin'")"
          if [ "$HASH_MATCH" != "1" ]; then
            echo "Stored password hash does not match the supplied BCrypt value." >&2
            exit 1
          fi

          mysql_exec -N -B -D "$DB_NAME" -e "select concat('verified user_id=',user_id,', status=',status,', del_flag=',del_flag) from sys_user where user_name='admin'"
          echo "Previous account record backed up at $BACKUP_FILE"

          LOGIN_PAYLOAD="$(ADMIN_PASSWORD="$ADMIN_PASSWORD" python3 - <<'PY'
          import json
          import os
          print(json.dumps({
              "username": "admin",
              "password": os.environ["ADMIN_PASSWORD"],
              "code": "",
              "uuid": "",
          }, separators=(",", ":")))
          PY
          )"

          verify_login_response() {
            local label="$1"
            local response="$2"
            LOGIN_RESPONSE="$response" LOGIN_LABEL="$label" python3 - <<'PY'
          import json
          import os
          payload = json.loads(os.environ["LOGIN_RESPONSE"])
          if payload.get("code") != 200 or not payload.get("token"):
              raise SystemExit(f"{os.environ['LOGIN_LABEL']} login verification failed: code={payload.get('code')} msg={payload.get('msg')}")
          print(f"{os.environ['LOGIN_LABEL']} login verification succeeded")
          PY
          }

          DIRECT_RESPONSE="$(curl -fsS -H 'Content-Type: application/json' --data-binary "$LOGIN_PAYLOAD" http://127.0.0.1:8007/login)"
          if ! verify_login_response direct-backend "$DIRECT_RESPONSE"; then
            echo "Recent backend authentication diagnostics:" >&2
            grep -E '登录用户：?admin|admin.*不存在|Bad credentials|密码' "$APP_DIR/logs/wangkejava.log" 2>/dev/null | tail -n 20 >&2 || true
            exit 1
          fi

          NGINX_RESPONSE="$(curl -fksS --resolve wwwht.yzzhixue.cn:443:127.0.0.1 -H 'Content-Type: application/json' --data-binary "$LOGIN_PAYLOAD" https://wwwht.yzzhixue.cn/prod-api/login)"
          verify_login_response local-nginx "$NGINX_RESPONSE"
          REMOTE
